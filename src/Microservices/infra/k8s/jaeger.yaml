apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: ims
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              valueFrom:
                secretKeyRef:
                  name: ims-env
                  key: COLLECTOR_OTLP_ENABLED
            # nginx 用 /jaeger 這個 path 反代進來,Jaeger UI 自己內部的資源/API 路徑也要對得上,
            # 不然頁面資源會抓到根目錄去 404。
            - name: QUERY_BASE_PATH
              value: /jaeger
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
