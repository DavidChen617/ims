apiVersion: v1
kind: ConfigMap
metadata:
  name: organization-migrations
  namespace: ims
data:
  000001_create_warehouse_table.down.sql: |
    drop table if exists warehouse;
  000001_create_warehouse_table.up.sql: |
    create table warehouse (
        id uuid primary key,
        name text not null unique
    );
  000002_create_users_table.down.sql: |
    drop table if exists users;
  000002_create_users_table.up.sql: |
    create table users (
        id uuid primary key,
        warehouse_id uuid null references warehouse (id),
        name text not null,
        username text not null unique,
        password_hash text not null,
        created_at timestamptz not null,
        role smallint not null
    );

    create index ix_users_warehouse_id on users (warehouse_id);
  000003_create_refresh_token_table.down.sql: |
    drop table if exists refresh_token;
  000003_create_refresh_token_table.up.sql: |
    create table refresh_token (
        id uuid primary key,
        token text not null unique,
        replaced_by_token text null,
        user_id uuid not null references users (id),
        created_at timestamptz not null,
        expires_at timestamptz not null,
        revoke_at timestamptz null
    );

    create index ix_refresh_token_user_id on refresh_token (user_id);
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ordering-migrations
  namespace: ims
data:
  000001_create_product_units_table.down.sql: |
    drop table if exists product_units;
  000001_create_product_units_table.up.sql: |
    create table product_units (
        name text primary key
    );
  000002_create_products_table.down.sql: |
    drop table if exists products;
  000002_create_products_table.up.sql: |
    create table products (
        id uuid primary key,
        product_no text not null unique,
        name text not null,
        unit text not null references product_units (name),
        price numeric not null
    );
  000003_create_inbound_orders_table.down.sql: |
    drop table if exists inbound_order_items;
    drop table if exists inbound_orders;
  000003_create_inbound_orders_table.up.sql: |
    create table inbound_orders (
        id uuid primary key,
        order_no text not null unique,
        warehouse_id uuid not null,
        status smallint not null,
        reject_reason text null,
        requested_by uuid not null,
        requested_at timestamptz not null,
        confirmed_by uuid null,
        confirmed_at timestamptz null
    );

    create table inbound_order_items (
        id serial primary key,
        inbound_order_id uuid not null references inbound_orders (id),
        product_id uuid not null references products (id),
        quantity integer not null,
        unit_price numeric not null
    );

    create index ix_inbound_order_items_inbound_order_id on inbound_order_items (inbound_order_id);
  000004_create_outbound_orders_table.down.sql: |
    drop table if exists outbound_order_items;
    drop table if exists outbound_orders;
  000004_create_outbound_orders_table.up.sql: |
    create table outbound_orders (
        id uuid primary key,
        order_no text not null unique,
        warehouse_id uuid not null,
        status smallint not null,
        reject_reason text null,
        requested_by uuid not null,
        requested_at timestamptz not null,
        confirmed_by uuid null,
        confirmed_at timestamptz null
    );

    create table outbound_order_items (
        id serial primary key,
        outbound_order_id uuid not null references outbound_orders (id),
        product_id uuid not null references products (id),
        quantity integer not null
    );

    create index ix_outbound_order_items_outbound_order_id on outbound_order_items (outbound_order_id);
  000005_create_outbox_messages_table.down.sql: |
    drop table if exists outbox_messages;
  000005_create_outbox_messages_table.up.sql: |
    create table outbox_messages (
        id uuid primary key,
        event_type text not null,
        payload text not null,
        occurred_on timestamptz not null,
        processed_on timestamptz null,
        error text null
    );

    create index ix_outbox_messages_processed_on on outbox_messages (processed_on) where processed_on is null;
  000006_add_requester_and_confirmer_names.down.sql: |
    alter table inbound_orders
        drop column requested_by_name,
        drop column confirmed_by_name;

    alter table outbound_orders
        drop column requested_by_name,
        drop column confirmed_by_name;
  000006_add_requester_and_confirmer_names.up.sql: |
    alter table inbound_orders
        add column requested_by_name text,
        add column confirmed_by_name text;

    alter table outbound_orders
        add column requested_by_name text,
        add column confirmed_by_name text;
  000007_add_outbox_retry_and_dead_letter.down.sql: |
    alter table outbox_messages
        drop column retry_count,
        drop column dead_lettered_at;
  000007_add_outbox_retry_and_dead_letter.up.sql: |
    alter table outbox_messages
        add column retry_count int not null default 0,
        add column dead_lettered_at timestamptz null;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-migrations
  namespace: ims
data:
  000001_create_stocks_table.down.sql: |
    drop table if exists stocks;
  000001_create_stocks_table.up.sql: |
    create table stocks (
        id uuid primary key,
        product_id uuid not null,
        warehouse_id uuid not null,
        quantity integer not null,
        cumulative_shipped integer not null,
        unique (product_id, warehouse_id)
    );
  000002_create_inbox_messages_table.down.sql: |
    drop table if exists inbox_messages;
  000002_create_inbox_messages_table.up.sql: |
    create table inbox_messages (
        event_id uuid primary key,
        processed_at timestamptz not null
    );
  000003_create_outbox_messages_table.down.sql: |
    drop table if exists outbox_messages;
  000003_create_outbox_messages_table.up.sql: |
    create table outbox_messages (
        id uuid primary key,
        event_type text not null,
        payload text not null,
        occurred_on timestamptz not null,
        processed_on timestamptz null,
        error text null
    );

    create index ix_outbox_messages_processed_on on outbox_messages (processed_on) where processed_on is null;
  000004_add_display_columns_to_stocks_table.down.sql: |
    alter table stocks
        drop column product_no,
        drop column product_name,
        drop column unit,
        drop column warehouse_name;
  000004_add_display_columns_to_stocks_table.up.sql: |
    alter table stocks
        add column product_no text,
        add column product_name text,
        add column unit text,
        add column warehouse_name text;
  000005_add_outbox_retry_and_dead_letter.down.sql: |
    alter table outbox_messages
        drop column retry_count,
        drop column dead_lettered_at;
  000005_add_outbox_retry_and_dead_letter.up.sql: |
    alter table outbox_messages
        add column retry_count int not null default 0,
        add column dead_lettered_at timestamptz null;
