apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ims
resources:
  - namespace.yaml
  - config.yaml
  - migrations-config.yaml
  - storage.yaml
  - postgres.yaml
  - kafka.yaml
  - redis.yaml
  - jaeger.yaml
  - migrations.yaml
  - apps.yaml
  - certbot-renew.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: ims-env
    envs:
      - .env
