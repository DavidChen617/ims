apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: ims
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: ims
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      nodeSelector:
        ims-role: ingress
      tolerations:
        - key: dedicated
          operator: Equal
          value: ingress
          effect: NoSchedule
      containers:
        - name: nginx
          image: ims/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              hostPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              hostPort: 443
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: certbot-webroot
              mountPath: /var/www/certbot
            - name: letsencrypt
              mountPath: /etc/letsencrypt
              readOnly: true
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
        - name: certbot-webroot
          hostPath:
            path: /var/www/certbot
            type: DirectoryOrCreate
        - name: letsencrypt
          hostPath:
            path: /etc/letsencrypt
            type: DirectoryOrCreate
