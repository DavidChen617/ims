# -source 用 golang-migrate 的 github source driver 直接從 repo 拉 migration 檔案。
# __MIGRATION_REPO__/__MIGRATION_REF__ 這兩個 placeholder 由 CI 的 deploy job 用 sed 換成 github.repository/github.ref_name,
# 手動部署要自己換成實際的 owner/repo 跟 git tag。
apiVersion: batch/v1
kind: Job
metadata:
  name: organization-migrate
  namespace: ims
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-postgres
          image: postgres:18
          envFrom:
            - secretRef:
                name: ims-env
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER"; do sleep 2; done
      containers:
        - name: migrate
          image: migrate/migrate:v4.19.1
          imagePullPolicy: IfNotPresent
          env:
            - name: ORGANIZATION_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ims-env
                  key: ORGANIZATION_MIGRATION_DATABASE_URL
          args:
            - -source=github://__MIGRATION_REPO__/src/Microservices/src/Organization/Migrations#__MIGRATION_REF__
            - -database=$(ORGANIZATION_MIGRATION_DATABASE_URL)
            - up
---
