apiVersion: v1
kind: ServiceAccount
metadata:
  name: certbot-renew
  namespace: ims
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: certbot-renew
  namespace: ims
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["nginx"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: certbot-renew
  namespace: ims
subjects:
  - kind: ServiceAccount
    name: certbot-renew
    namespace: ims
roleRef:
  kind: Role
  name: certbot-renew
  apiGroup: rbac.authorization.k8s.io
---
# 每週續期一次；certbot 只有在 30 天內到期時才會真的換憑證,沒到期就是 no-op。
# 簡化取捨:不論這次有沒有真的續到新憑證,都會重啟 nginx(單一 replica,重啟當下有幾秒中斷)。
# 如果之後在意這幾秒 downtime,可以改成比對憑證檔案的 mtime/hash 決定要不要重啟。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: certbot-renew
  namespace: ims
spec:
  schedule: "0 3 * * 1"
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: certbot-renew
          restartPolicy: Never
          nodeSelector:
            ims-role: ingress
          tolerations:
            - key: dedicated
              operator: Equal
              value: ingress
              effect: NoSchedule
          initContainers:
            # certbot/certbot 的 :latest tag 沒有 arm64 manifest,套用前去 Docker Hub
            # https://hub.docker.com/r/certbot/certbot/tags 確認目前最新的 arm64v8-* tag。
            - name: certbot
              image: certbot/certbot:arm64v8-v3.1.0
              command:
                - certbot
                - renew
                - --webroot
                - -w
                - /webroot
                - --quiet
              volumeMounts:
                - name: certbot-webroot
                  mountPath: /webroot
                - name: letsencrypt
                  mountPath: /etc/letsencrypt
          containers:
            - name: reload-nginx
              image: bitnami/kubectl:1.32
              command:
                - kubectl
                - rollout
                - restart
                - deployment/nginx
                - -n
                - ims
          volumes:
            - name: certbot-webroot
              hostPath:
                path: /var/www/certbot
                type: DirectoryOrCreate
            - name: letsencrypt
              hostPath:
                path: /etc/letsencrypt
                type: DirectoryOrCreate