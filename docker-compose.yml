name: ims

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.12
    environment:
      KAFKA_NODE_ID: "${KAFKA_NODE_ID}"
      KAFKA_PROCESS_ROLES: "${KAFKA_PROCESS_ROLES}"
      KAFKA_LISTENERS: "${KAFKA_LISTENERS}"
      KAFKA_ADVERTISED_LISTENERS: "${KAFKA_ADVERTISED_LISTENERS}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "${KAFKA_CONTROLLER_LISTENER_NAMES}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}"
      KAFKA_INTER_BROKER_LISTENER_NAME: "${KAFKA_INTER_BROKER_LISTENER_NAME}"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE}"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}"
      CLUSTER_ID: "${CLUSTER_ID}"
    ports:
      - "9092:29092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "${COLLECTOR_OTLP_ENABLED}"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  organization-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/Organization/Migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${ORGANIZATION_MIGRATION_DATABASE_URL}
      - up

  ordering-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/Ordering/Migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${ORDERING_MIGRATION_DATABASE_URL}
      - up

  inventory-migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/Inventory/Migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=${INVENTORY_MIGRATION_DATABASE_URL}
      - up

  organization:
    build:
      context: .
      dockerfile: src/Organization/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      organization-migrate:
        condition: service_completed_successfully
      jaeger:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "${ORGANIZATION_CONNECTION_STRING}"
      JwtSetting__Issuer: "${ORGANIZATION_JWT_ISSUER}"
      JwtSetting__Audience: "${JWT_AUDIENCE}"
      JwtSetting__RefreshTokenExpiresInDay: "${ORGANIZATION_JWT_REFRESH_TOKEN_EXPIRES_IN_DAY}"
      JwtSetting__AccessTokenExpiresInMinuets: "${ORGANIZATION_JWT_ACCESS_TOKEN_EXPIRES_IN_MINUETS}"
      Admin__Password: "${ADMIN_PASSWORD}"
      RSA_PEM_PATH: "${RSA_PEM_PATH}"
      Otel__OtlpEndpoint: "${OTEL_OTLP_ENDPOINT}"
    ports:
      - "5032:8080"
    healthcheck:
      # aspnet runtime image 沒裝 curl/wget,/bin/sh 又是 dash 不支援 /dev/tcp,
      # 所以要明確叫 bash 來用它內建的 /dev/tcp 直接送 HTTP request。
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 'HTTP/1.1 200'"]
      interval: 5s
      timeout: 5s
      retries: 10

  ordering:
    build:
      context: .
      dockerfile: src/Ordering/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ordering-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      jaeger:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "${ORDERING_CONNECTION_STRING}"
      JwtSetting__Authority: "${JWT_AUTHORITY}"
      JwtSetting__Audience: "${JWT_AUDIENCE}"
      Kafka__BootstrapServers: "${KAFKA_BOOTSTRAP_SERVERS}"
      Kafka__Topics__Ordering: "${KAFKA_ORDERING_TOPIC}"
      Kafka__Topics__OrderingDeadLetter: "${KAFKA_ORDERING_DEAD_LETTER_TOPIC}"
      Kafka__Topics__Inventory: "${KAFKA_INVENTORY_TOPIC}"
      Kafka__Topics__InventoryDeadLetter: "${KAFKA_INVENTORY_DEAD_LETTER_TOPIC}"
      Otel__OtlpEndpoint: "${OTEL_OTLP_ENDPOINT}"
      Redis__ConnectionString: "${REDIS_CONNECTION_STRING}"
    ports:
      - "5116:8080"

  inventory:
    build:
      context: .
      dockerfile: src/Inventory/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      inventory-migrate:
        condition: service_completed_successfully
      organization:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      ConnectionStrings__DefaultConnection: "${INVENTORY_CONNECTION_STRING}"
      JwtSetting__Authority: "${JWT_AUTHORITY}"
      JwtSetting__Audience: "${JWT_AUDIENCE}"
      Kafka__BootstrapServers: "${KAFKA_BOOTSTRAP_SERVERS}"
      Kafka__Topics__Ordering: "${KAFKA_ORDERING_TOPIC}"
      Kafka__Topics__OrderingDeadLetter: "${KAFKA_ORDERING_DEAD_LETTER_TOPIC}"
      Kafka__Topics__Inventory: "${KAFKA_INVENTORY_TOPIC}"
      Kafka__Topics__InventoryDeadLetter: "${KAFKA_INVENTORY_DEAD_LETTER_TOPIC}"
      Otel__OtlpEndpoint: "${OTEL_OTLP_ENDPOINT}"
    ports:
      - "5205:8080"

  nginx:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      organization:
        condition: service_healthy
      ordering:
        condition: service_started
      inventory:
        condition: service_started
    ports:
      - "80:80"

volumes:
  pgdata:
